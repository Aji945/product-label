<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>商品資訊搜尋系統 - 隆順興</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #EDF0EE;
            --paper: #FFFFFF;
            --ink: #1C1F1D;
            --muted: #5B635E;
            --line: #C9CFCB;
            --accent: #0E5E5A;
            --accent-soft: #D8ECEA;
            --line-green: #00B900;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Noto Sans TC', system-ui, sans-serif;
            font-weight: 400;
            font-size: 15px;
            line-height: 1.7;
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrap {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .wrap-wide {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .site-title {
            margin: 0;
            padding: 32px 0 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* 搜尋列 */
        .search-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg);
            padding: 10px 0;
            transition: box-shadow 0.2s ease;
        }

        .search-bar.is-stuck {
            box-shadow: 0 1px 0 var(--line);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-field {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        #searchInput {
            width: 100%;
            height: 48px;
            padding: 0 44px 0 16px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--paper);
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            -webkit-appearance: none;
            appearance: none;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }

        #clearButton {
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        #clearButton:hover { color: var(--ink); }

        .search-btn {
            flex-shrink: 0;
            height: 48px;
            padding: 0 20px;
            border: 0;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .search-btn:hover { background: #0B4D4A; }

        .hidden { display: none !important; }

        /* 下拉建議 */
        #suggestions {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 4px);
            margin: 0;
            padding: 4px 0;
            list-style: none;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 4px;
            box-shadow: 0 8px 24px rgba(28, 31, 29, 0.12);
            z-index: 30;
            overflow: hidden;
        }

        .sug-item {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 56px;
            padding: 0 12px;
            cursor: pointer;
        }

        .sug-item:hover { background: var(--bg); }

        .sug-item.is-active {
            background: var(--accent-soft);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .sug-thumb {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 2px;
            background: #E1E5E2;
            object-fit: cover;
            display: block;
        }

        .sug-name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        mark {
            background: var(--accent-soft);
            color: var(--ink);
            text-decoration: underline;
            text-decoration-color: var(--accent);
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
        }

        .sug-item.is-active mark { background: transparent; }

        /* 說明與發票 */
        .info {
            margin-top: 20px;
            padding: 20px;
            background: var(--paper);
            border-radius: 4px;
        }

        .info h2 {
            margin: 0 0 10px;
            font-size: 17px;
            font-weight: 700;
        }

        .steps {
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: step;
            display: grid;
            gap: 6px;
        }

        .steps li {
            counter-increment: step;
            display: flex;
            gap: 10px;
            align-items: baseline;
        }

        .steps li::before {
            content: counter(step);
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border: 1px solid var(--ink);
            border-radius: 50%;
            font-size: 13px;
            font-weight: 500;
            line-height: 20px;
            text-align: center;
        }

        .contact {
            margin: 14px 0 0;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            color: var(--muted);
        }

        .invoice p {
            margin: 0;
            color: var(--muted);
        }

        .invoice-link {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--accent);
            font-weight: 500;
            text-decoration: none;
        }

        .invoice-link:hover { background: var(--accent-soft); }

        /* 結果 */
        #results { margin-top: 20px; }

        .status {
            padding: 32px 0;
            text-align: center;
            color: var(--muted);
        }

        .status.error { color: #A3271F; }

        .result-count {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .product {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .product-img {
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: #E1E5E2;
            overflow: hidden;
            cursor: zoom-in;
            display: block;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-img.is-empty { cursor: default; }

        .label {
            width: 100%;
            min-width: 0;
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 4px;
        }

        .label-title {
            margin: 0;
            padding: 12px 14px;
            border-bottom: 2px solid var(--ink);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.45;
            word-break: break-word;
        }

        .label-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .label-table th,
        .label-table td {
            padding: 8px 12px;
            vertical-align: top;
            text-align: left;
            border-top: 1px solid var(--line);
        }

        .label-table tr:first-child th,
        .label-table tr:first-child td { border-top: 0; }

        .label-table th {
            width: 5.5em;
            box-sizing: content-box;
            border-right: 1px solid var(--line);
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .label-table td {
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-line;
            word-break: break-word;
        }

        .platforms {
            border-top: 2px solid var(--ink);
        }

        .platforms summary {
            padding: 10px 14px;
            min-height: 44px;
            cursor: pointer;
            font-weight: 500;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .platforms summary::-webkit-details-marker { display: none; }

        .platforms summary::after {
            content: '';
            flex-shrink: 0;
            width: 8px;
            height: 8px;
            margin-right: 4px;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: translateY(-2px) rotate(45deg);
            transition: transform 0.2s ease;
        }

        .platforms[open] summary::after { transform: translateY(2px) rotate(-135deg); }

        .platforms .label-table { border-top: 1px solid var(--line); }

        @media (min-width: 768px) {
            .site-title { font-size: 28px; padding-top: 48px; }

            .product {
                flex-direction: row;
                align-items: flex-start;
                gap: 24px;
            }

            .product-img {
                width: 200px;
                max-width: 200px;
            }

            .label-title { font-size: 22px; }
        }

        /* 浮動鈕 */
        .float-actions {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 40;
        }

        @supports (padding: max(0px)) {
            .float-actions { bottom: max(20px, env(safe-area-inset-bottom)); }
        }

        .float-actions a {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(28, 31, 29, 0.2);
        }

        .float-line { background: var(--line-green); font-size: 26px; }
        .float-phone { background: var(--accent); font-size: 20px; }

        @media (max-width: 767.98px) {
            .float-actions {
                right: 12px;
                bottom: 16px;
                gap: 10px;
            }

            @supports (padding: max(0px)) {
                .float-actions { bottom: max(16px, env(safe-area-inset-bottom)); }
            }

            .float-actions a {
                width: 44px;
                height: 44px;
            }

            .float-line { font-size: 24px; }
            .float-phone { font-size: 18px; }

            /* 結果區右側與底部讓出浮動鈕的位置 */
            #results {
                padding-right: 48px;
                padding-bottom: 120px;
            }
        }

        /* 放大視窗 */
        #imageModal {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #imageModal.hidden { display: none !important; }

        .modal-box {
            position: relative;
            width: 100%;
            max-width: 900px;
        }

        .modal-box iframe {
            width: 100%;
            height: 80vh;
            border: 0;
            border-radius: 4px;
            background: #000;
        }

        .modal-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        footer {
            margin-top: 32px;
            padding: 16px 0 88px;
            border-top: 1px solid var(--line);
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .main { flex: 1; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="wrap">
            <h1 class="site-title">商品資訊搜尋系統</h1>
        </header>

        <div class="search-bar" id="searchContainer">
            <div class="wrap">
                <div class="search-box">
                    <div class="search-field">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="輸入關鍵詞搜尋..."
                            autocomplete="off"
                            role="combobox"
                            aria-autocomplete="list"
                            aria-expanded="false"
                            aria-controls="suggestions"
                            aria-label="搜尋商品"
                        >
                        <button id="clearButton" type="button" class="hidden" aria-label="清除">
                            <i class="fas fa-times"></i>
                        </button>
                        <ul id="suggestions" class="hidden" role="listbox"></ul>
                    </div>
                    <button type="button" id="searchButton" class="search-btn">搜尋</button>
                </div>
            </div>
        </div>

        <main class="main">
            <div class="wrap">
                <section id="instructions" class="info">
                    <h2>操作說明</h2>
                    <ol class="steps">
                        <li>輸入產品關鍵字，從清單點選商品或按「搜尋」</li>
                        <li>查看商品圖片與中文標示</li>
                    </ol>
                    <p class="contact">大宗訂購或任何問題，請點右下 LINE 或撥打電話聯繫</p>
                </section>

                <section id="invoiceSection" class="info invoice">
                    <h2>蝦皮電子發票專區</h2>
                    <p>請「完成訂單」後點擊下方連結</p>
                    <p>可進行 統編/歸戶/載具/捐贈/查詢</p>
                    <a href="https://i.ajinerp.com/" target="_blank" rel="noopener" class="invoice-link">
                        <i class="fas fa-external-link-alt"></i>
                        <span>前往開立電子發票</span>
                    </a>
                </section>
            </div>

            <div class="wrap-wide">
                <div id="results"></div>
            </div>
        </main>

        <footer>
            <div class="wrap" id="copyright">© 2024 隆順興有限公司版權所有 抄襲必究</div>
        </footer>
    </div>

    <div class="float-actions">
        <a href="https://line.me/ti/p/95aeasIFGP" target="_blank" rel="noopener" class="float-line" aria-label="LINE">
            <i class="fab fa-line"></i>
        </a>
        <a href="tel:+886908851249" class="float-phone" aria-label="電話">
            <i class="fas fa-phone"></i>
        </a>
    </div>

    <div id="imageModal" class="hidden">
        <div class="modal-box"></div>
    </div>

    <script>
        const API_KEY = 'AIzaSyCvZiOO5ax2WekV95A6C4--0YbDVZVBToQ';
        const SHEET_ID = '15pOyPD6HYcjsfoqkKcuyQeXPMjE3pE9gTTGgIt6MbuA';

        const searchInput = document.getElementById('searchInput');
        const suggestionsDiv = document.getElementById('suggestions');
        const resultsDiv = document.getElementById('results');
        const clearButton = document.getElementById('clearButton');
        const imageModal = document.getElementById('imageModal');

        const PLATFORM_COLS = [1, 2, 3, 4];
        const DETAIL_COLS = [6, 7, 8, 9, 10, 11, 12];
        const MAX_SUGGESTIONS = 6;

        let suggestionRows = [];
        let activeIndex = -1;
        let timeoutId;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function highlight(text, query) {
            const source = String(text ?? '');
            const q = query.toLowerCase();
            const lower = source.toLowerCase();
            if (!q) return escapeHtml(source);
            let out = '';
            let pos = 0;
            let idx = lower.indexOf(q, pos);
            while (idx !== -1) {
                out += escapeHtml(source.slice(pos, idx));
                out += '<mark>' + escapeHtml(source.slice(idx, idx + q.length)) + '</mark>';
                pos = idx + q.length;
                idx = lower.indexOf(q, pos);
            }
            return out + escapeHtml(source.slice(pos));
        }

        function matchesAE(row, query) {
            const q = query.toLowerCase();
            return row.slice(0, 5).some(cell => cell?.toLowerCase().includes(q));
        }

        async function fetchRows() {
            const response = await fetch(
                `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/A:M?key=${API_KEY}`
            );
            const data = await response.json();
            const [headers = [], ...rows] = data.values || [];
            return { headers, rows };
        }

        // ---------- 下拉建議 ----------

        function hideSuggestions() {
            suggestionsDiv.classList.add('hidden');
            searchInput.setAttribute('aria-expanded', 'false');
            searchInput.removeAttribute('aria-activedescendant');
            activeIndex = -1;
        }

        function setActive(index) {
            const items = suggestionsDiv.querySelectorAll('.sug-item');
            if (!items.length) return;
            activeIndex = (index + items.length) % items.length;
            items.forEach((item, i) => {
                const on = i === activeIndex;
                item.classList.toggle('is-active', on);
                item.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            searchInput.setAttribute('aria-activedescendant', items[activeIndex].id);
        }

        async function fetchSuggestions() {
            const query = searchInput.value.trim();
            if (query.length < 2) {
                hideSuggestions();
                return;
            }

            try {
                const { rows } = await fetchRows();
                if (searchInput.value.trim() !== query) return;

                suggestionRows = rows
                    .filter(row => row[0] && matchesAE(row, query))
                    .slice(0, MAX_SUGGESTIONS);

                if (!suggestionRows.length) {
                    hideSuggestions();
                    return;
                }

                suggestionsDiv.innerHTML = suggestionRows.map((row, i) => {
                    const thumb = row[5]
                        ? `<img class="sug-thumb" src="${escapeHtml(getImageUrl(row[5]))}" alt="" loading="lazy" onerror="this.removeAttribute('src')">`
                        : '<span class="sug-thumb"></span>';
                    return `
                        <li class="sug-item" id="sug-${i}" role="option" aria-selected="false" data-index="${i}">
                            ${thumb}
                            <span class="sug-name">${highlight(row[0], query)}</span>
                        </li>
                    `;
                }).join('');

                activeIndex = -1;
                suggestionsDiv.classList.remove('hidden');
                searchInput.setAttribute('aria-expanded', 'true');
            } catch (error) {
                console.error('獲取建議失敗:', error);
            }
        }

        function selectSuggestion(index) {
            const row = suggestionRows[index];
            if (!row) return;
            searchInput.value = row[0];
            hideSuggestions();
            updateClearButton();
            handleSearch(row[0]);
        }

        suggestionsDiv.addEventListener('mousedown', event => event.preventDefault());

        suggestionsDiv.addEventListener('click', event => {
            event.stopPropagation();
            const item = event.target.closest('.sug-item');
            if (item) selectSuggestion(Number(item.dataset.index));
        });

        suggestionsDiv.addEventListener('mousemove', event => {
            const item = event.target.closest('.sug-item');
            if (item && Number(item.dataset.index) !== activeIndex) {
                setActive(Number(item.dataset.index));
            }
        });

        // ---------- 搜尋結果 ----------

        function renderProduct(row, headers) {
            const name = row[0] || '';
            const image = row[5]
                ? `<button type="button" class="product-img" data-preview="${escapeHtml(getDetailLink(row[5]))}" aria-label="放大圖片">
                       <img src="${escapeHtml(getImageUrl(row[5]))}" alt="${escapeHtml(name)}" onerror="this.remove()">
                   </button>`
                : '<div class="product-img is-empty" aria-hidden="true"></div>';

            const detailRows = DETAIL_COLS
                .filter(i => row[i] && String(row[i]).trim())
                .map(i => `
                    <tr>
                        <th scope="row">${escapeHtml(headers[i] || '')}</th>
                        <td>${escapeHtml(String(row[i]).trim())}</td>
                    </tr>
                `).join('');

            const platformRows = PLATFORM_COLS
                .filter(i => row[i] && String(row[i]).trim())
                .map(i => `
                    <tr>
                        <th scope="row">${escapeHtml(headers[i] || '')}</th>
                        <td>${escapeHtml(String(row[i]).trim())}</td>
                    </tr>
                `).join('');

            return `
                <article class="product">
                    ${image}
                    <div class="label">
                        <h2 class="label-title">${escapeHtml(name)}</h2>
                        ${detailRows ? `<table class="label-table"><tbody>${detailRows}</tbody></table>` : ''}
                        ${platformRows ? `
                            <details class="platforms">
                                <summary>各平台商品名稱</summary>
                                <table class="label-table"><tbody>${platformRows}</tbody></table>
                            </details>
                        ` : ''}
                    </div>
                </article>
            `;
        }

        async function handleSearch(exactName) {
            const query = searchInput.value.trim();
            if (!query) return;

            hideSuggestions();
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('invoiceSection').style.display = 'none';
            updateClearButton();
            resultsDiv.innerHTML = '<div class="status">搜尋中...</div>';

            try {
                const { headers, rows } = await fetchRows();

                const results = typeof exactName === 'string'
                    ? rows.filter(row => row[0] === exactName)
                    : rows.filter(row => matchesAE(row, query));

                if (results.length > 0) {
                    resultsDiv.innerHTML = `
                        ${results.length > 1 ? `<p class="result-count">找到 ${results.length} 個結果</p>` : ''}
                        ${results.map(row => renderProduct(row, headers)).join('')}
                        ${getInvoiceSection()}
                    `;
                    const top = document.getElementById('searchContainer').offsetHeight;
                    window.scrollTo({
                        top: Math.max(0, resultsDiv.getBoundingClientRect().top + window.scrollY - top - 12),
                        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
                    });
                } else {
                    resultsDiv.innerHTML = `
                        <div class="status">未找到相關結果</div>
                        ${getInvoiceSection()}
                    `;
                }
            } catch (error) {
                console.error('搜尋失敗:', error);
                resultsDiv.innerHTML = '<div class="status error">搜尋失敗，請稍後重試</div>';
            }
        }

        // ---------- 放大圖片 ----------

        function openModal(src) {
            imageModal.querySelector('.modal-box').innerHTML = `
                <iframe src="${escapeHtml(src)}" allow="autoplay" title="商品圖片"></iframe>
                <button type="button" class="modal-close" aria-label="關閉"><i class="fas fa-times"></i></button>
            `;
            imageModal.classList.remove('hidden');
            imageModal.querySelector('.modal-close').focus();
        }

        function closeModal() {
            imageModal.classList.add('hidden');
            imageModal.querySelector('.modal-box').innerHTML = '';
        }

        resultsDiv.addEventListener('click', event => {
            const btn = event.target.closest('.product-img[data-preview]');
            if (btn) openModal(btn.dataset.preview);
        });

        imageModal.addEventListener('click', event => {
            if (event.target === imageModal || event.target.closest('.modal-close')) closeModal();
        });

        // ---------- 輸入與清除 ----------

        function updateClearButton() {
            clearButton.classList.toggle('hidden', !searchInput.value);
        }

        function clearSearch() {
            searchInput.value = '';
            updateClearButton();
            hideSuggestions();
            resultsDiv.innerHTML = '';
            document.getElementById('instructions').style.display = '';
            document.getElementById('invoiceSection').style.display = '';
            searchInput.focus();
        }

        clearButton.addEventListener('click', clearSearch);
        document.getElementById('searchButton').addEventListener('click', () => handleSearch());

        searchInput.addEventListener('input', () => {
            updateClearButton();
            clearTimeout(timeoutId);
            timeoutId = setTimeout(fetchSuggestions, 300);
        });

        searchInput.addEventListener('click', function (event) {
            event.stopPropagation();
            if (this.value.trim().length >= 2 && suggestionsDiv.classList.contains('hidden')) {
                fetchSuggestions();
            }
        });

        searchInput.addEventListener('keydown', function (event) {
            const open = !suggestionsDiv.classList.contains('hidden');
            if (event.key === 'ArrowDown' && open) {
                event.preventDefault();
                setActive(activeIndex + 1);
            } else if (event.key === 'ArrowUp' && open) {
                event.preventDefault();
                setActive(activeIndex - 1);
            } else if (event.key === 'Escape') {
                if (open) {
                    event.preventDefault();
                    hideSuggestions();
                }
            } else if (event.key === 'Enter') {
                event.preventDefault();
                if (event.isComposing) return;
                clearTimeout(timeoutId);
                if (open && activeIndex >= 0) {
                    selectSuggestion(activeIndex);
                } else if (this.value.trim()) {
                    handleSearch();
                }
            }
        });

        document.addEventListener('click', event => {
            if (!searchInput.contains(event.target) && !suggestionsDiv.contains(event.target)) {
                hideSuggestions();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !imageModal.classList.contains('hidden')) closeModal();
        });

        // 捲動後搜尋列固定在頂端
        const searchContainer = document.getElementById('searchContainer');
        window.addEventListener('scroll', () => {
            searchContainer.classList.toggle('is-stuck', window.scrollY > 100);
        }, { passive: true });

        // ---------- 圖片網址 ----------

        function extractFileId(url) {
            if (url && url.includes('drive.google.com')) {
                let fileId;
                if (url.includes('/open?id=')) {
                    fileId = url.split('/open?id=')[1].split('&')[0];
                } else if (url.includes('/file/d/')) {
                    fileId = url.split('/file/d/')[1].split('/')[0];
                } else if (url.includes('/folders/')) {
                    fileId = url.split('/folders/')[1].split('?')[0];
                }
                return fileId;
            }
            return null;
        }

        function getImageUrl(url) {
            if (!url) return null;
            const fileId = extractFileId(url);
            if (fileId) {
                return `https://drive.google.com/thumbnail?id=${fileId}`;
            }
            return url;
        }

        function getDetailLink(url) {
            const fileId = extractFileId(url);
            if (fileId) {
                return `https://drive.google.com/file/d/${fileId}/preview`;
            }
            return url;
        }

        document.getElementById('copyright').textContent = `© ${new Date().getFullYear()} 隆順興有限公司版權所有 抄襲必究`;

        function getInvoiceSection() {
            return `
                <section class="info invoice">
                    <h2>蝦皮電子發票專區</h2>
                    <p>請「完成訂單」後點擊下方連結</p>
                    <p>可進行 統編/歸戶/載具/捐贈/查詢</p>
                    <a href="https://i.ajinerp.com/" target="_blank" rel="noopener" class="invoice-link">
                        <i class="fas fa-external-link-alt"></i>
                        <span>前往開立電子發票</span>
                    </a>
                </section>
            `;
        }
    </script>
</body>
</html>
